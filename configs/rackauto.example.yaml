listen: ":8080"
public_url: "http://10.0.0.1:8080"
data_dir: "./data"
api_token: ""                 # 给 Agent / 脚本用；网页登录默认 admin / admin
tftp_listen: ":69"

# 内置 DHCP 也可在 Web「网络引导」里开关，并指定接入网卡。下列为默认值。
dhcp:
  enabled: false
  interface: ""          # 接入网卡，例如 eth1 / enp1s0
  listen_addr: "0.0.0.0:67"
  subnet: "10.0.0.0/24"
  range_start: "10.0.0.100"
  range_end: "10.0.0.200"
  router: ""             # 必须和地址池同一网段；空则用 next-server。填错会导致 iPXE Network unreachable
  dns: "8.8.8.8"
  lease_sec: 3600
  next_server: ""        # 空则用接入网卡 IPv4

bootstrap:
  ubuntu_release: "26.04"          # 最新稳定版 LTS live-server，用作内存 RAMOS
  ubuntu_mirror: ""                # 空或 auto=从 Ubuntu 官方 CD 镜像列表取路径并选延迟最低的（不含阿里云）；也可钉死例如 https://mirrors.tuna.tsinghua.edu.cn/ubuntu-releases
  ubuntu_cdimage: ""               # ARM ISO 根；空或 auto=同样从官方 CD 镜像列表选（不含阿里云）
  ubuntu_iso: ""                   # 已有 amd64 ISO 时填本地路径，跳过下载
  ubuntu_iso_arm: ""
  ubuntu_arches: ["x86_64"]        # 还要装 ARM 服务器时加上 aarch64（会再下一份 ISO）
