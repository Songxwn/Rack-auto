listen: ":8080"
public_url: "http://10.0.0.1:8080"
data_dir: "./data"
api_token: ""
tftp_listen: ":69"

# 实验室可打开内置 DHCP；生产环境建议沿用现有 DHCP，仅把 next-server/filename 指过来
dhcp:
  enabled: false
  interface: ""
  listen_addr: "0.0.0.0:67"
  subnet: "10.0.0.0/24"
  range_start: "10.0.0.100"
  range_end: "10.0.0.200"
  router: "10.0.0.1"
  dns: "8.8.8.8"
  lease_sec: 3600

bootstrap:
  alpine_version: "3.21"
