listen: ":8080"
public_url: "http://10.0.0.1:8080"
data_dir: "./data"
api_token: ""
tftp_listen: ":69"

# 内置 DHCP 也可在 Web「网络引导」里开关，并指定接入网卡。下列为默认值。
dhcp:
  enabled: false
  interface: ""          # 接入网卡，例如 eth1 / enp1s0
  listen_addr: "0.0.0.0:67"
  subnet: "10.0.0.0/24"
  range_start: "10.0.0.100"
  range_end: "10.0.0.200"
  router: "10.0.0.1"
  dns: "8.8.8.8"
  lease_sec: 3600
  next_server: ""        # 空则用接入网卡 IPv4

bootstrap:
  alpine_version: "3.21"
