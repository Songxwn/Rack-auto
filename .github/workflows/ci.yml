name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build
        run: |
          go build -o /tmp/rackauto ./cmd/rackauto
          go build -o /tmp/rackauto-agent ./cmd/rackauto-agent
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/winpe-curl.exe ./cmd/winpe-curl
