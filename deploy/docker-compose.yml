services:
  rackauto:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: rackauto:local
    container_name: rackauto
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_BIND_SERVICE
    volumes:
      - rackauto-data:/var/lib/rackauto
      - ../configs/rackauto.example.yaml:/etc/rackauto.yaml:ro
    environment:
      TZ: Asia/Shanghai

volumes:
  rackauto-data:
